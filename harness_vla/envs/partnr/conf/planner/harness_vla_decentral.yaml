_target_: 'partnr_harness.bridge_planner.HarnessBridgePlanner'
_recursive_: False
_partial_: True

# Harness VLA decentralized brain: one instance PER agent behind its own
# bridge planner. Individual Task/Global Memory (<dir>/<agent_label>/) and
# partner awareness through published transcripts (actions + results only)
# under shared_memory_dir/<episode_id>/<agent_label>.jsonl.
plan_config:
  max_decisions: 50
  enable_signals: True
  action_history_window: 5
  log_decisions: True
  max_consecutive_llm_failures: 10
  symmetric_partner_snapshot: True
  expose_bootstrap_label: False
  harness:
    _target_: 'harness_vla.envs.partnr.decentralized.HarnessVlaDecentralized'
    shared_memory_dir: ${hydra:runtime.output_dir}/memory
    base_url: 'http://localhost:11435/v1'
    model: ${model_pool.model}
    temperature: ${model_pool.temperature}
    repeat_penalty: ${model_pool.repeat_penalty}
    repeat_last_n: ${model_pool.repeat_last_n}
    thinking_budget: ${model_pool.thinking_budget}
    max_tokens: ${model_pool.max_tokens}
    timeout_s: 240
    world_char_budget: 12000
    enable_thinking: ${model_pool.enable_thinking}
    disable_thinking: ${model_pool.disable_thinking}
    num_ctx: ${model_pool.num_ctx}
    max_retries: 3
    max_history: 0
    zero_shot: True
    phase: deployment
    task_memory_dir: null
    global_memory_path: null
