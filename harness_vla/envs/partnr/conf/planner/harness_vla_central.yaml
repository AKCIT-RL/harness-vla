_target_: 'partnr_harness.centralized_planner.CentralizedHarnessPlanner'
_recursive_: False
_partial_: True

# Harness VLA controller: ONE brain commands BOTH agents (agent_0 Spot robot,
# agent_1 human) through a single LLM. Full team transcript in every prompt,
# Task/Global Memory (deployment) and R1 subgoal claims for deterministic Done.
plan_config:
  max_decisions: 100
  enable_signals: True
  action_history_window: 5
  log_decisions: True
  max_consecutive_llm_failures: 10
  # Privileged bootstrap label (official task_state_success) delivered to the
  # agent in EpisodeSummary.extras.bootstrap_label. Keep False for deployment.
  expose_bootstrap_label: False
  harness:
    _target_: 'harness_vla.envs.partnr.agent.HarnessVlaCentralized'
    use_claims: True
    base_url: 'http://localhost:11435/v1'
    model: ${model_pool.model}
    temperature: ${model_pool.temperature}
    repeat_penalty: ${model_pool.repeat_penalty}
    repeat_last_n: ${model_pool.repeat_last_n}
    thinking_budget: ${model_pool.thinking_budget}
    max_tokens: ${model_pool.max_tokens}
    timeout_s: 240
    world_char_budget: 12000
    enable_thinking: ${model_pool.enable_thinking}
    disable_thinking: ${model_pool.disable_thinking}
    num_ctx: ${model_pool.num_ctx}
    max_retries: 3
    # 0 = full episode transcript in the prompt (paper-confirmed).
    max_history: 0
    # Memory protocol: zero_shot True = control without memory; deployment
    # reads task_memory_dir/global_memory_path; phase bootstrap writes Task
    # Memory from successful episodes (needs expose_bootstrap_label: True).
    zero_shot: True
    phase: deployment
    task_memory_dir: null
    global_memory_path: null
