# @package _global_
# Two-agent (human + robot) driven by ONE Harness VLA controller
# (harness_vla.envs.partnr.agent.HarnessVlaCentralized) behind the env's
# CentralizedHarnessPlanner. Full observability, no videos.

defaults:
  - /examples/planner_multi_agent_demo_config
  - /model_pool: gemma4_12b_off_4k
  - override /evaluation: centralized_evaluation_runner_multi_agent
  - override /planner@evaluation.planner: harness_vla_central
  - override /agent@evaluation.agents.agent_0.config: harness_primitive_agent
  - override /agent@evaluation.agents.agent_1.config: harness_primitive_agent

world_model:
  partial_obs: False

evaluation:
  save_video: False
