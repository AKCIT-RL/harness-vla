# @package _global_
# Phase-5 E2E validation: two robots, each driven by one LLM call per decision
# (OpenAI-compatible endpoint) with a DIFFERENT prompt prefix per robot.

defaults:
  - /examples/two_robot_planner_demo_config
  - override /planner@evaluation.agents.agent_0.planner: harness_llm_prefix_planner
  - override /planner@evaluation.agents.agent_1.planner: harness_llm_prefix_planner
  - override /agent@evaluation.agents.agent_0.config: oracle_rearrange_agent_motortoolsonly
  - override /agent@evaluation.agents.agent_1.config: oracle_rearrange_agent_motortoolsonly

world_model:
  partial_obs: True

evaluation:
  agents:
    agent_0:
      planner:
        plan_config:
          harness:
            prefix: 'You are Robot-0, a Spot robot collaborating with Robot-1 on a household task. Prefer navigation and rearrangement sub-tasks in rooms your partner is not working in.'
    agent_1:
      planner:
        plan_config:
          harness:
            prefix: 'You are Robot-1, a Spot robot collaborating with Robot-0 on a household task. Prefer sub-tasks your partner has not started yet.'
