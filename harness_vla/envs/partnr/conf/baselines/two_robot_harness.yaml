# @package _global_
# Phase-2 baseline: TWO ROBOTS (both SpotRobot), each driven by the bridge with
# its own harness instance. No LLM required (RandomHarness default).

defaults:
  - /examples/two_robot_planner_demo_config
  - override /planner@evaluation.agents.agent_0.planner: harness_random_planner
  - override /planner@evaluation.agents.agent_1.planner: harness_random_planner
  - override /agent@evaluation.agents.agent_0.config: oracle_rearrange_agent_motortoolsonly
  - override /agent@evaluation.agents.agent_1.config: oracle_rearrange_agent_motortoolsonly

world_model:
  partial_obs: True

evaluation:
  agents:
    agent_1:
      planner:
        plan_config:
          harness:
            seed: 1
