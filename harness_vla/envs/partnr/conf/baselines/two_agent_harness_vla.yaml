# @package _global_
# Two-agent (human + robot): BOTH agents driven by the paper harness adapter
# (harness_vla.envs.partnr.adapter.PartnrHarnessAdapter), each with its OWN
# HarnessBridgePlanner instance. Full observability, no videos.

defaults:
  - /examples/planner_multi_agent_demo_config
  - /model_pool: gemma4_12b_off_4k
  - override /evaluation: decentralized_evaluation_runner_multi_agent
  - override /planner@evaluation.agents.agent_0.planner: harness_vla_planner
  - override /planner@evaluation.agents.agent_1.planner: harness_vla_planner
  - override /agent@evaluation.agents.agent_0.config: harness_primitive_agent
  - override /agent@evaluation.agents.agent_1.config: harness_primitive_agent

world_model:
  partial_obs: False

evaluation:
  save_video: False
