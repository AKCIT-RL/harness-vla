# @package _global_
# Standard-algorithm baseline: native single-agent zero-shot ReAct planner with
# its default tool set (incl. Rearrange/Explore), the selected model via Ollama,
# full observability and videos, for comparison with the harness.

defaults:
  - /examples/planner_multi_agent_demo_config
  - /model_pool: gemma3_1b_off
  - override /evaluation: decentralized_evaluation_runner_single_agent
  - override /planner@evaluation.agents.agent_0.planner: llm_zero_shot_react_planner
  - override /instruct@evaluation.agents.agent_0.planner.plan_config.instruct: zero_shot_prompt
  - override /llm@evaluation.agents.agent_0.planner.plan_config.llm: ollama_chat
  - override /agent@evaluation.agents.agent_0.config: oracle_rearrange_object_states_agent_motortoolsonly

world_model:
  partial_obs: False

evaluation:
  save_video: True
  agents:
    agent_0:
      planner:
        plan_config:
          constrained_generation: False
          objects_response: True
          replanning_threshold: 50
