# @package _global_
# Single Spot robot driven by the primitive-action harness (atomic tools only),
# full observability, videos enabled.

defaults:
  - /examples/planner_multi_agent_demo_config
  - /model_pool: gemma3_1b_off
  - override /evaluation: decentralized_evaluation_runner_single_agent
  - override /planner@evaluation.agents.agent_0.planner: harness_primitive_planner
  - override /agent@evaluation.agents.agent_0.config: harness_primitive_agent

world_model:
  partial_obs: False

evaluation:
  save_video: True
